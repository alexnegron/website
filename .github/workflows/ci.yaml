name: Build and Test

on:
  pull_request:
    branches:
      - v5
  push:
    branches:
      - v5
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/particle-system/package-lock.json

      - name: Install Quartz dependencies
        run: npm ci

      - name: Build custom particle component
        run: |
          npm ci --prefix plugins/particle-system
          npm run build --prefix plugins/particle-system

      - name: Verify generated particle artifacts
        run: git diff --exit-code -- plugins/particle-system/dist

      - name: Check types and formatting
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build site
        run: node quartz/bootstrap-cli.mjs build --bundleInfo
